# Temporary, bounded traffic generator; delete the Job and ConfigMap after use.
apiVersion: batch/v1
kind: Job
metadata:
  name: teamdesk-load-check
  namespace: teamdesk
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 240
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: teamdesk-load-check
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: requests
          # Reuse a verified application image for its Python standard library.
          image: ghcr.io/suhaniawasthi10/teamdesk-backend:1814bc1e583053e285a710e3924ab375a4f6b86b
          command: [python, /load/load_backend.py]
          args:
            - --url=http://teamdesk-backend:8000/api/employees
            - --seconds=180
            - --rate=120
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 300m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - name: load-script
              mountPath: /load
              readOnly: true
      volumes:
        - name: load-script
          configMap:
            name: teamdesk-load-check
