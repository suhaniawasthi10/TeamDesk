apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-deploy
  namespace: teamdesk
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: teamdesk-deployer
  namespace: teamdesk
rules:
  # Helm stores release metadata in Secrets; access is limited to this namespace.
  - apiGroups: [""]
    resources: [secrets, configmaps, services, persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods, pods/log, events, endpoints]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: teamdesk-deployer
  namespace: teamdesk
subjects:
  - kind: ServiceAccount
    name: github-deploy
    namespace: teamdesk
roleRef:
  kind: Role
  name: teamdesk-deployer
  apiGroup: rbac.authorization.k8s.io
