apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: teamdesk
  namespace: monitoring
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames: [teamdesk]
  selector:
    matchLabels:
      app.kubernetes.io/instance: teamdesk
      app.kubernetes.io/component: backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
