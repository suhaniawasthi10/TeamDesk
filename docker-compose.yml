name: teamdesk
services:
  frontend:
    build: ./frontend
    image: teamdesk-frontend:local
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: "8000"
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  backend:
    build: ./backend
    image: teamdesk-backend:local
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-teamdesk}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-teamdesk}
      APP_VERSION: local
    # One local replica owns migrations. EKS will use a separate migration Job.
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teamdesk}
      POSTGRES_USER: ${POSTGRES_USER:-teamdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
