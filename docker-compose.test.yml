name: teamdesk-tests
services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: teamdesk_test
      POSTGRES_USER: teamdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamdesk -d teamdesk_test"]
      interval: 2s
      timeout: 3s
      retries: 30
