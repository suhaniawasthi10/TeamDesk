name: TeamDesk CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Finish main deployments; cancellation can leave a Helm release pending.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: teamdesk_test
          POSTGRES_USER: teamdesk_test
          # Disposable CI database only; never used by the application.
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teamdesk_test -d teamdesk_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://teamdesk_test:ci-test-password@localhost:5432/teamdesk_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Check Python code
        run: |
          ruff check backend scripts
          ruff format --check backend scripts
      - name: Run API tests
        working-directory: backend
        run: pytest -v

  frontend:
    name: Frontend build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Check frontend formatting
        run: npm run format:check
      - name: Build frontend
        run: npm run build

  images:
    name: Build, scan and publish images
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set image names
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          echo "BACKEND_IMAGE=ghcr.io/${REPOSITORY_OWNER,,}/teamdesk-backend:$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${REPOSITORY_OWNER,,}/teamdesk-frontend:$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Build both images
        id: build
        run: |
          docker build --pull \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$BACKEND_IMAGE" backend
          docker build --pull \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$FRONTEND_IMAGE" frontend
      - name: Scan backend with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: ${{ env.BACKEND_IMAGE }}
          scanners: vuln
          vuln-type: os,library
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          timeout: 10m
      - name: Scan frontend with Trivy
        # Still report frontend findings when the backend scan fails.
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: ${{ env.FRONTEND_IMAGE }}
          scanners: vuln
          vuln-type: os,library
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          timeout: 10m
      - name: Log in to GHCR
        if: ${{ success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish scanned images
        if: ${{ success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          docker push "$BACKEND_IMAGE"
          docker push "$FRONTEND_IMAGE"
          printf '### Published images\n\n- `%s`\n- `%s`\n' "$BACKEND_IMAGE" "$FRONTEND_IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - name: Log out of GHCR
        if: ${{ always() }}
        run: docker logout ghcr.io

  deploy:
    name: Deploy to EKS
    needs: images
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_TO_EKS == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KUBECONFIG: ${{ runner.temp }}/teamdesk-kubeconfig
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install pinned deployment tools
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLo kubectl https://dl.k8s.io/release/v1.35.8/bin/linux/amd64/kubectl
          echo '874d5e72dbb819f43cff16bcd1e4f8bac5b7f2361fe1e55049b0a6c676fb0cbf  kubectl' | sha256sum --check
          sudo install -m 0755 kubectl /usr/local/bin/kubectl
          curl -fsSLO https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz
          echo '86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb  helm-v4.3.0-linux-amd64.tar.gz' | sha256sum --check
          tar -xzf helm-v4.3.0-linux-amd64.tar.gz
          sudo install -m 0755 linux-amd64/helm /usr/local/bin/helm
      - name: Configure namespace-scoped cluster access
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          test -n "$KUBE_CONFIG_DATA"
          umask 077
          printf '%s' "$KUBE_CONFIG_DATA" | base64 --decode > "$KUBECONFIG"
          kubectl auth can-i patch deployments -n teamdesk
      - name: Deploy scanned commit images
        run: |
          helm lint helm/teamdesk --set-string image.tag="$GITHUB_SHA"
          helm upgrade --install teamdesk helm/teamdesk --namespace teamdesk \
            --set-string image.tag="$GITHUB_SHA" \
            --wait --wait-for-jobs --rollback-on-failure --timeout 8m --history-max 5
          kubectl rollout status deployment/teamdesk-backend -n teamdesk --timeout=120s
          kubectl rollout status deployment/teamdesk-frontend -n teamdesk --timeout=120s
      - name: Verify deployed release
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          for component in backend frontend; do
            deployed=$(kubectl get deployment "teamdesk-$component" -n teamdesk -o jsonpath='{.spec.template.spec.containers[0].image}')
            test "$deployed" = "ghcr.io/${REPOSITORY_OWNER,,}/teamdesk-$component:$GITHUB_SHA"
          done
          address=$(kubectl get ingress teamdesk -n teamdesk -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          test -n "$address"
          python3 scripts/verify_deployment.py --url "http://$address" --sha "$GITHUB_SHA"
          printf '### Deployment verified\n\nCommit: `%s`\n\n[Open TeamDesk](http://%s)\n' "$GITHUB_SHA" "$address" >> "$GITHUB_STEP_SUMMARY"
      - name: Show rollout diagnostics
        if: ${{ failure() }}
        run: |
          kubectl get pods,deployments,jobs -n teamdesk
          kubectl get events -n teamdesk --sort-by=.lastTimestamp
      - name: Remove runner credentials
        if: ${{ always() }}
        run: rm -f "$KUBECONFIG"
